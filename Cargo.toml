[package]
name = "dissonance"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.17"
audiotags = "0.5.0"
walkdir = "2.2.9"
pathdiff = "0.2.2"
remove_empty_subdirs = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
slint-build = "1.17"
